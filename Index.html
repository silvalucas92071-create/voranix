<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORANIX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050914;
  color:#fff;
  min-height:100vh;
}

button{
  font-family:inherit;
}

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(5,9,20,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(80,140,255,.12);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
}

.logo-dragon{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#1478ff,#743cff);
  box-shadow:0 0 25px rgba(45,115,255,.45);
  font-size:22px;
}

.nav{
  display:flex;
  gap:25px;
}

.nav button{
  background:none;
  border:0;
  color:#9da8bf;
  cursor:pointer;
  font-size:14px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  color:#fff;
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:50%;
  background:#10182a;
  color:#fff;
  cursor:pointer;
}

.hero{
  min-height:650px;
  padding:150px 7% 90px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 45%,rgba(43,95,255,.25),transparent 35%),
    radial-gradient(circle at 90% 80%,rgba(126,52,255,.18),transparent 30%),
    linear-gradient(90deg,#050914 0%,rgba(5,9,20,.9) 45%,rgba(5,9,20,.25) 100%);
}

.hero:after{
  content:"";
  position:absolute;
  right:-100px;
  top:80px;
  width:620px;
  height:620px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(43,119,255,.2),transparent 65%);
  pointer-events:none;
}

.hero-content{
  max-width:650px;
  position:relative;
  z-index:2;
}

.badge{
  display:inline-block;
  padding:7px 13px;
  border:1px solid rgba(87,145,255,.35);
  border-radius:30px;
  background:rgba(34,85,180,.15);
  color:#70a9ff;
  font-size:12px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(42px,7vw,78px);
  line-height:.98;
  margin-bottom:20px;
  letter-spacing:-2px;
}

.hero h1 span{
  color:#579cff;
}

.hero p{
  color:#b2bdd1;
  font-size:17px;
  line-height:1.7;
